name: ⏱️ Synchro Taux Promoteur Automatique (4H)

on:
  schedule:
    # Déclenchements précis toutes les 4 heures (minute 01) couvrant parfaitement l'alternance Été/Hiver
    - cron: '1 22,2,6,10,14,18 * * *'
    - cron: '1 23,3,7,11,15,19 * * *'
  workflow_dispatch:

jobs:
  execution_cron:
    runs-on: ubuntu-latest
    steps:
    - name: 📥 Récupération du code
      uses: actions/checkout@v4

    - name: 🐍 Installation de Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: 📦 Installation des dépendances
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    # Inspection conservée à des fins de diagnostic en cas de coupure système
    - name: 🔍 Inspection des Fichiers Disponibles
      run: |
        echo "=== Emplacement actuel ==="
        pwd
        echo "=== Liste des fichiers à la racine ==="
        ls -la
        echo "=== Vérification de la version Python ==="
        python --version

    - name: 🚀 Lancement de la synchronisation des Taux
      env:
        FIREBASE_CREDENTIALS_JSON: ${{ secrets.FIREBASE_CREDENTIALS_JSON }}
      run: python run_cron_taux.py
