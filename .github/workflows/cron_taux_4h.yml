name: ⏱️ Synchro Taux Promoteur Automatique (4H)

on:
  schedule:
    # Fréquence toutes les 4h basée sur l'heure UTC brute (ex: 22h, 02h, 06h...)
    - cron: '1 22,2,6,10,14,18 * * *'
  workflow_dispatch:
  repository_dispatch: 
    types: [run_taux] # ✅ Corrigé : Parfaitement imbriqué sous repository_dispatch

jobs:
  execution_cron:
    runs-on: ubuntu-latest
    steps:
    - name: 📥 Récupération du code
      uses: actions/checkout@v4

    - name: 🐍 Installation de Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: 📦 Installation des dépendances
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: 🔍 Inspection des Fichiers Disponibles
      run: |
        echo "=== Emplacement actuel ==="
        pwd
        echo "=== Liste des fichiers à la racine ==="
        ls -la

    - name: 🚀 Lancement de la synchronisation des Taux
      env:
        FIREBASE_CREDENTIALS_JSON: ${{ secrets.FIREBASE_CREDENTIALS_JSON }}
      run: python run_cron_taux.py
