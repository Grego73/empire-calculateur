name: ⏱️ Synchro Taux Promoteur Automatique (4H)

on:
  schedule:
    - cron: '1 22,23,2,3,6,7,10,11,14,15,18,19 * * *'
  workflow_dispatch:

jobs:
  execution_cron:
    runs-on: ubuntu-latest
    steps:
    - name: 📥 Récupération du code
      uses: actions/checkout@v4

    - name: 🐍 Installation de Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: 📦 Installation des dépendances
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    # 👀 DIAGNOSTIC SYSTÈME DIRECT (Pour voir pourquoi Python coupe)
    - name: 🔍 Inspection des Fichiers Disponibles
      run: |
        echo "=== Emplacement actuel ==="
        pwd
        echo "=== Liste des fichiers à la racine ==="
        ls -la
        echo "=== Vérification de la version Python ==="
        python --version

    - name: 🚀 Lancement de la synchronisation des Taux
      env:
        FIREBASE_CREDENTIALS_JSON: ${{ secrets.FIREBASE_CREDENTIALS_JSON }}
      run: python run_cron_taux.py
