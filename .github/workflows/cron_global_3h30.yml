name: ⏱️ Synchro Globale API Empire (Quotidien 3h30)

on:
  schedule:
    # Déclenchement à la minute 30 pour couvrir 3h30 heure d'été et heure d'hiver
    - cron: '30 1,2 * * *'
  workflow_dispatch: # Permet toujours un déclenchement manuel en 1 clic

jobs:
  execution_cron_global:
    runs-on: ubuntu-latest
    steps:
    - name: 📥 Récupération du code
      uses: actions/checkout@v4

    - name: 🐍 Installation de Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: 📦 Installation des dépendances
      run: |
        python -m pip install --upgrade pip
        pip install requests firebase-admin pandas google-cloud-firestore streamlit tzdata

    - name: 🚀 Lancement de la synchronisation complète
      env:
        FIREBASE_CREDENTIALS_JSON: ${{ secrets.FIREBASE_CREDENTIALS_JSON }}
      run: python run_cron_global.py
