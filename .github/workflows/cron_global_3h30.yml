name: ⏱️ Synchro Globale API Empire (Quotidien 3h30)

on:
  schedule:
    - cron: '30 1,2 * * *'
  workflow_dispatch: # Permet toujours le déclenchement manuel
  repository_dispatch: # NOOUVEAU : Permet au Cron Job externe de le lancer
    types: [run_global]
    
jobs:
  execution_cron_global:
    runs-on: ubuntu-latest
    steps:
    - name: 📥 Récupération du code
      uses: actions/checkout@v4

    - name: 🐍 Installation de Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip' # Optimisation : met en cache les paquets pour accélérer les futurs lancements

    - name: 📦 Installation des dépendances
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: 🚀 Lancement de la synchronisation complète
      env:
        FIREBASE_CREDENTIALS_JSON: ${{ secrets.FIREBASE_CREDENTIALS_JSON }}
      run: python run_cron_global.py
